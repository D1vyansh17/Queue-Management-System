<!DOCTYPE html>
<html>
<head>
    <title>Token Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #1a1a1a; color: white; }
        .container { display: flex; justify-content: space-around; padding: 20px; }
        #now-serving { font-size: 100px; color: #00ff00; margin: 20px; border: 4px solid #00ff00; padding: 20px; border-radius: 20px; }
        .queue-list { background: #333; width: 300px; height: 400px; overflow-y: auto; border-radius: 10px; padding: 10px; }
        button { background: #28a745; color: white; padding: 20px 40px; font-size: 24px; border: none; border-radius: 10px; cursor: pointer; }
        button:active { background: #218838; }
        .token-item { background: #444; margin: 5px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Staff Display</h1>
    
    <div id="now-serving">---</div>
    <button onclick="callNext()">CALL NEXT PERSON</button>

    <div class="container">
        <div>
            <h3>Waiting List</h3>
            <div id="queue-box" class="queue-list"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const queueBox = document.getElementById('queue-box');

        // When someone messages the bot
        socket.on('new_entry', (user) => {
            const div = document.createElement('div');
            div.className = 'token-item';
            div.id = 't-' + user.id;
            div.innerText = "Token #" + user.id + " (" + user.name + ")";
            queueBox.appendChild(div);
        });

        // When a token is called
        socket.on('now_calling', (user) => {
            document.getElementById('now-serving').innerText = "#" + user.id;
            const item = document.getElementById('t-' + user.id);
            if(item) item.remove();
            
            // Computer voice announcement
            const speech = new SpeechSynthesisUtterance("aao na baby " + user.id + " please come in me");
            window.speechSynthesis.speak(speech);
        });

        async function callNext() {
            await fetch('/call-next');
        }
    </script>
</body>
</html>
